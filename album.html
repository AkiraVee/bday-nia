<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Album 🎵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="album-body">

<div class="album-wrap">
  <div class="album-art-large">
    <img class="player-cover-img" src="" alt="">
    <svg class="player-note-icon" viewBox="0 0 24 24" fill="none">
      <path d="M9 18V5l12-2v13" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="18" r="3" stroke="#fff" stroke-width="1.6"/>
      <circle cx="18" cy="16" r="3" stroke="#fff" stroke-width="1.6"/>
    </svg>
  </div>

  <div class="player-info">
    <div class="player-title">Track 01</div>
    <div class="player-artist">add your song title</div>
  </div>

  <div class="player-progress-row">
    <span class="player-time-current">0:00</span>
    <div class="player-progress-bar"><div class="player-progress-fill"></div></div>
    <span class="player-time-duration">0:00</span>
  </div>

  <div class="player-controls">
    <button type="button" class="player-btn player-prev" aria-label="Previous song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
    </button>
    <button type="button" class="player-btn player-play" aria-label="Play or pause">
      <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button type="button" class="player-btn player-next" aria-label="Next song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
    </button>
  </div>

  <div class="player-volume-row">
    <button type="button" class="volume-btn" aria-label="Mute or unmute">
      <svg class="icon-vol-on" viewBox="0 0 24 24" fill="currentColor">
        <path d="M5 9v6h4l5 5V4L9 9H5z"/>
        <path d="M16.5 12c0-1.77-.77-3.29-2-4.32v8.64c1.23-1.03 2-2.55 2-4.32z"/>
        <path d="M19 12c0-3.08-1.64-5.7-4-6.92v1.9c1.31 1.1 2.15 2.87 2.15 5.02s-.84 3.92-2.15 5.02v1.9c2.36-1.22 4-3.84 4-6.92z"/>
      </svg>
      <svg class="icon-vol-mute" viewBox="0 0 24 24" fill="currentColor">
        <path d="M5 9v6h4l5 5V4L9 9H5z"/>
        <path d="M19 8.5l-1.5-1.5-2.5 2.5-2.5-2.5L11 8.5l2.5 2.5-2.5 2.5 1.5 1.5 2.5-2.5 2.5 2.5 1.5-1.5-2.5-2.5z"/>
      </svg>
    </button>
    <input type="range" class="volume-slider" min="0" max="100" value="80" aria-label="Volume">
  </div>

  <div class="playlist-panel playlist-panel-full">
    <h2 class="playlist-heading">MUSIC</h2>
    <ul class="playlist-list"></ul>
  </div>

  <audio id="player-audio" preload="metadata"></audio>
</div>

<a class="back-btn" href="main_menu.html">BACK</a>

<script src="script.js"></script>
<script src="transitions.js"></script>

</body>
</html>
